<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olist Insights | Entrar</title>
<meta name="description" content="Dashboard analítico do Data Warehouse Olist.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M32 6L56 18L32 30L8 18Z%22 fill=%22%23f6851b%22 stroke=%22%23f6851b%22 stroke-width=%222.4%22/%3E%3Cpath d=%22M8 29L32 41L56 29%22 stroke=%22%23c9a27a%22 stroke-width=%223%22/%3E%3Cpath d=%22M8 40L32 52L56 40%22 stroke=%22%238b949e%22 stroke-width=%223%22/%3E%3Ccircle cx=%2232%22 cy=%2218%22 r=%223%22 fill=%22%23141618%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
<canvas id="hero3d"></canvas>
<form class="login-card" id="form" autocomplete="on">
  <div class="brand"><span data-mark style="display:contents"></span><b>Olist Insights</b></div>
  <h1>Bem-vinda de volta</h1>
  <p class="sub">Entre para acessar o dashboard do Data Warehouse.</p>
  <div class="field"><label for="user">Usuário</label>
    <div class="box"><input id="user" name="username" autocomplete="username" required autofocus></div></div>
  <div class="field"><label for="pass">Senha</label>
    <div class="box"><input id="pass" name="password" type="password" autocomplete="current-password" required>
    <button type="button" class="toggle" id="toggle">Mostrar</button></div></div>
  <div class="error" id="error" role="alert"></div>
  <button class="btn-primary" id="submit">Entrar</button>
  <p class="login-foot">Acesso restrito. Dados públicos do dataset Olist (Kaggle).</p>
</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/js/mark.js"></script>
<script src="/js/scene.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
