ay="4 5"/><rect x="1052" y="83" width="160" height="46" rx="10" fill="#000" opacity=".06"/><rect x="1050" y="80" width="160" height="46" rx="10" fill="#e8effb" stroke="#2f5fb3" stroke-width="1.6"/><rect x="1050" y="80" width="160" height="30" rx="10" fill="#2f5fb3"/><rect x="1050" y="100" width="160" height="10" fill="#2f5fb3"/><text x="1130.0" y="100" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">dashboard.json</text><line x1="1130" y1="126" x2="1130" y2="490" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="110" y1="170" x2="470" y2="170" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="290.0" y="162" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">1. POST usuário e senha</text><path d="M470 210 h50 v22 h-50" fill="none" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="532" y="225" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start">2. scrypt(senha, salt) vs AUTH_PASS_HASH</text><line x1="470" y1="250" x2="110" y2="250" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="290.0" y="242" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">3. Set-Cookie HttpOnly, Secure, SameSite=Strict</text><line x1="110" y1="310" x2="830" y2="310" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="470.0" y="302" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">4. GET /api/data com cookie</text><path d="M830 350 h50 v22 h-50" fill="none" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="892" y="365" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start">5. Verifica HMAC e expiração</text><line x1="830" y1="415" x2="1130" y2="415" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="980.0" y="407" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">6. Lê arquivo privado (fora de public/)</text><line x1="830" y1="465" x2="110" y2="465" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="470.0" y="457" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">7. 200 JSON (ou 401 sem sessão válida)</text><text x="30" y="38" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Fluxo de autenticação e acesso aos dados</text><rect x="30" y="48" width="64" height="4" rx="2" fill="#e2761b"/></svg>