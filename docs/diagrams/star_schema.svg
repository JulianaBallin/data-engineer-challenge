/text><text x="30" y="775" font-size="12" font-weight="400" fill="#617080" text-anchor="start">Grão: fact_orders = 1 linha por pedido. fact_order_items = 1 por item. fact_payments = 1 por pagamento. Setas tracejadas: relacionamentos secundários.</text><text x="30" y="38" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Modelo dimensional (estrela) da camada gold</text><rect x="30" y="48" width="64" height="4" rx="2" fill="#e2761b"/></svg>