"2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="300" y="345" font-size="11.5" font-weight="600" fill="#617080" text-anchor="start">bronze (cópia fiel)</text><rect x="32" y="463" width="330" height="80" rx="10" fill="#000" opacity=".06"/><rect x="30" y="460" width="330" height="80" rx="10" fill="#e5f4ec" stroke="#1f7a4d" stroke-width="1.6"/><rect x="30" y="460" width="330" height="30" rx="10" fill="#1f7a4d"/><rect x="30" y="480" width="330" height="10" fill="#1f7a4d"/><text x="195.0" y="480" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Análise (SQL + notebook)</text><text x="44" y="512" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">analytics.sql + Matplotlib: 5 perguntas</text><text x="44" y="531" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">reports/charts/*.png</text><rect x="402" y="463" width="330" height="80" rx="10" fill="#000" opacity=".06"/><rect x="400" y="460" width="330" height="80" rx="10" fill="#e5f4ec" stroke="#1f7a4d" stroke-width="1.6"/><rect x="400" y="460" width="330" height="30" rx="10" fill="#1f7a4d"/><rect x="400" y="480" width="330" height="10" fill="#1f7a4d"/><text x="565.0" y="480" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Export (export_web.py)</text><text x="414" y="512" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Agregados da gold em JSON</text><text x="414" y="531" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">api/_data/dashboard.json (privado)</text><rect x="772" y="463" width="480" height="80" rx="10" fill="#000" opacity=".06"/><rect x="770" y="460" width="480" height="80" rx="10" fill="#e5f4ec" stroke="#1f7a4d" stroke-width="1.6"/><rect x="770" y="460" width="480" height="30" rx="10" fill="#1f7a4d"/><rect x="770" y="480" width="480" height="10" fill="#1f7a4d"/><text x="1010.0" y="480" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Vercel: login + API protegida + dashboard 3D</text><text x="784" y="512" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Cookie HttpOnly assinado (HMAC), senha com scrypt</text><text x="784" y="531" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Chart.js e Three.js no navegador</text><line x1="540" y1="420" x2="200" y2="460" stroke="#1f7a4d" stroke-width="2" marker-end="url(#ah)"/><line x1="640" y1="420" x2="565" y2="460" stroke="#1f7a4d" stroke-width="2" marker-end="url(#ah)"/><line x1="730" y1="500" x2="770" y2="500" stroke="#1f7a4d" stroke-width="2" marker-end="url(#ah)"/><text x="30" y="38" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Arquitetura do projeto: do CSV ao dashboard</text><rect x="30" y="48" width="64" height="4" rx="2" fill="#e2761b"/></svg>