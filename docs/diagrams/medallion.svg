<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Arquitetura em camadas (medallion) no DuckDB"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#617080"/></marker></defs><rect width="1280" height="520" fill="#ffffff"/><rect x="32" y="113" width="360" height="270" rx="10" fill="#000" opacity=".06"/><rect x="30" y="110" width="360" height="270" rx="10" fill="#f7ece4" stroke="#a9693a" stroke-width="1.6"/><rect x="30" y="110" width="360" height="30" rx="10" fill="#a9693a"/><rect x="30" y="130" width="360" height="10" fill="#a9693a"/><text x="210.0" y="130" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">BRONZE</text><text x="44" y="162" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Cópia fiel dos 9 CSVs</text><text x="44" y="181" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Todas as colunas em VARCHAR</text><text x="44" y="200" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Sem filtros nem correções</text><text x="44" y="219" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Objetivo: rastreabilidade</text><text x="44" y="238" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"></text><text x="44" y="257" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Ex.: bronze.orders (99.441)</text><text x="44" y="276" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">bronze.geolocation (1.000.163)</text><rect x="462" y="113" width="360" height="270" rx="10" fill="#000" opacity=".06"/><rect x="460" y="110" width="360" height="270" rx="10" fill="#eef0f2" stroke="#7b8794" stroke-width="1.6"/><rect x="460" y="110" width="360" height="30" rx="10" fill="#7b8794"/><rect x="460" y="130" width="360" height="10" fill="#7b8794"/><text x="640.0" y="130" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">SILVER</text><text x="474" y="162" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Dados limpos e tipados</text><text x="474" y="181" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Datas em TIMESTAMP, valores em DOUBLE</text><text x="474" y="200" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Duplicidades e nulos tratados</text><text x="474" y="219" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Categorias traduzidas (EN)</text><text x="474" y="238" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Flag has_date_inconsistency</text><text x="474" y="257" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"></text><text x="474" y="276" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Ex.: silver.geolocation (19.010)</text><rect x="892" y="113" width="360" height="270" rx="10" fill="#000" opacity=".06"/><rect x="890" y="110" width="360" height="270" rx="10" fill="#fbf3dc" stroke="#c9971c" stroke-width="1.6"/><rect x="890" y="110" width="360" height="30" rx="10" fill="#c9971c"/><rect x="890" y="130" width="360" height="10" fill="#c9971c"/><text x="1070.0" y="130" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">GOLD</text><text x="904" y="162" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Modelo estrela para análise</text><text x="904" y="181" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">dim_customer, dim_seller, dim_product, dim_date</text><text x="904" y="200" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">fact_order_items, fact_payments</text><text x="904" y="219" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">fact_orders: tabela derivada</text><text x="904" y="238" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">delivery_days, delay_days, is_late</text><text x="904" y="257" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"></text><text x="904" y="276" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Consumida por SQL, notebook e API</text><line x1="390" y1="245" x2="460" y2="245" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="425.0" y="237.0" font-size="11.5" font-weight="600" fill="#617080" text-anchor="middle">limpeza</text><line x1="820" y1="245" x2="890" y2="245" stroke="#617080" stroke-width="2" marker-end="url(#ah)"/><text x="855.0" y="237.0" font-size="11.5" font-weight="600" fill="#617080" text-anchor="middle">modelagem</text><rect x="32" y="413" width="1220" height="80" rx="10" fill="#000" opacity=".06"/><rect x="30" y="410" width="1220" height="80" rx="10" fill="#fff1e3" stroke="#e2761b" stroke-width="1.6"/><rect x="30" y="410" width="1220" height="30" rx="10" fill="#e2761b"/><rect x="30" y="430" width="1220" height="10" fill="#e2761b"/><text x="640.0" y="430" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Por que camadas?</text><text x="44" y="462" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Cada transformação é auditável (bronze x silver x gold), a limpeza é reexecutável e a gold simplifica as consultas,</text><text x="44" y="481" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">evitando duplicação de linhas em joins (1 avaliação por pedido, 1 coordenada por CEP).</text><text x="30" y="38" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Arquitetura em camadas (medallion) no DuckDB</text><rect x="30" y="48" width="64" height="4" rx="2" fill="#e2761b"/></svg>